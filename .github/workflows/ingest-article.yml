name: Import article

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: Stable orchestration identifier from the publishing manifest
        required: true
        type: string
      doc_file_id:
        description: Google Drive file ID of the complete editorial Google Doc
        required: true
        type: string
      doc_version:
        description: Google Drive version snapshot of the editorial document
        required: true
        type: string
      image_file_id:
        description: Google Drive file ID of the lead image binary
        required: true
        type: string
      image_version:
        description: Google Drive version snapshot of the lead image
        required: true
        type: string
      substack_url:
        description: Canonical public article reference on amiszczak.substack.com
        required: true
        type: string
      linkedin_url:
        description: Public LinkedIn discussion URL; preserved exactly
        required: true
        type: string
      published_at:
        description: Trusted publication timestamp from the publishing manifest
        required: true
        type: string
      last_modified_at:
        description: Optional real source modification timestamp
        required: false
        default: ""
        type: string
      request_id:
        description: Unique orchestration request identifier, normally generated by n8n
        required: true
        type: string

permissions:
  contents: read

jobs:
  acquire_source:
    name: Acquire deterministic Google Drive source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout master without persisted credentials
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false

      - name: Validate every workflow input before source acquisition
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          DOC_FILE_ID: ${{ inputs.doc_file_id }}
          DOC_VERSION: ${{ inputs.doc_version }}
          IMAGE_FILE_ID: ${{ inputs.image_file_id }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          SUBSTACK_URL: ${{ inputs.substack_url }}
          LINKEDIN_URL: ${{ inputs.linkedin_url }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          LAST_MODIFIED_AT: ${{ inputs.last_modified_at }}
          REQUEST_ID: ${{ inputs.request_id }}
          CONTENT_SOURCE_FOLDER_ID: ${{ vars.CONTENT_SOURCE_FOLDER_ID }}
        run: python3 _scripts/fetch_google_source.py validate-inputs

      - name: Reject an already imported canonical Substack reference
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          DOC_FILE_ID: ${{ inputs.doc_file_id }}
          DOC_VERSION: ${{ inputs.doc_version }}
          IMAGE_FILE_ID: ${{ inputs.image_file_id }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          SUBSTACK_URL: ${{ inputs.substack_url }}
          LINKEDIN_URL: ${{ inputs.linkedin_url }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          LAST_MODIFIED_AT: ${{ inputs.last_modified_at }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 _scripts/fetch_google_source.py check-duplicate

      - name: Install the small Google acquisition dependency set
        run: python3 -m pip install --disable-pip-version-check -r _scripts/requirements-content-automation.txt

      - name: Authenticate to Google
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Acquire version-pinned Google Doc and lead image
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          DOC_FILE_ID: ${{ inputs.doc_file_id }}
          DOC_VERSION: ${{ inputs.doc_version }}
          IMAGE_FILE_ID: ${{ inputs.image_file_id }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          SUBSTACK_URL: ${{ inputs.substack_url }}
          LINKEDIN_URL: ${{ inputs.linkedin_url }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          LAST_MODIFIED_AT: ${{ inputs.last_modified_at }}
          REQUEST_ID: ${{ inputs.request_id }}
          CONTENT_SOURCE_FOLDER_ID: ${{ vars.CONTENT_SOURCE_FOLDER_ID }}
        run: python3 _scripts/fetch_google_source.py acquire

      - name: Upload only the deterministic source package
        uses: actions/upload-artifact@v4
        with:
          name: article-source-${{ inputs.request_id }}
          path: .automation/content-source/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  generate_validate_publish:
    name: Generate, validate, and publish pull request
    needs: acquire_source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Fresh checkout of master without persisted credentials
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false

      - name: Download the deterministic source package
        uses: actions/download-artifact@v4
        with:
          name: article-source-${{ inputs.request_id }}
          path: .automation/content-source

      - name: Verify the source package shape and record pre-Codex SHA-256 hashes
        id: source_integrity
        run: python3 _scripts/fetch_google_source.py record-integrity

      - name: Run source acquisition tests
        run: python3 -m unittest discover -s _scripts/tests -p 'test_*.py'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"

      - name: Install locked Ruby dependencies outside the checkout
        run: |
          bundle config get path
          bundle install --jobs 4 --retry 3
        env:
          BUNDLE_APP_CONFIG: ${{ runner.temp }}/article-import-bundle-config
          BUNDLE_PATH: ${{ runner.temp }}/article-import-bundle

      - name: Install the pinned Pagefind dependency before Codex
        run: npm install --prefix "$RUNNER_TEMP/pagefind" pagefind@1.5.2

      - name: Confirm dependency setup left the checkout clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "Dependency setup changed files in the checkout; stopping before Codex."
            exit 1
          fi

      - name: Validate the default pull request reviewer
        env:
          CONTENT_PR_REVIEWER: ${{ vars.CONTENT_PR_REVIEWER || 'Adammiszczak' }}
        run: |
          if [[ ! "$CONTENT_PR_REVIEWER" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "CONTENT_PR_REVIEWER must be a valid GitHub login." >&2
            exit 1
          fi

      - name: Run Codex with repository instructions
        uses: openai/codex-action@v1
        env:
          BUNDLE_APP_CONFIG: ${{ runner.temp }}/article-import-bundle-config
          BUNDLE_PATH: ${{ runner.temp }}/article-import-bundle
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .github/prompts/import-article.md

      - name: Validate generated articles and source integrity
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          DOC_FILE_ID: ${{ inputs.doc_file_id }}
          DOC_VERSION: ${{ inputs.doc_version }}
          IMAGE_FILE_ID: ${{ inputs.image_file_id }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          SUBSTACK_URL: ${{ inputs.substack_url }}
          LINKEDIN_URL: ${{ inputs.linkedin_url }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          LAST_MODIFIED_AT: ${{ inputs.last_modified_at }}
          REQUEST_ID: ${{ inputs.request_id }}
          CONTENT_SOURCE_FOLDER_ID: ${{ vars.CONTENT_SOURCE_FOLDER_ID }}
          SOURCE_MD_SHA256: ${{ steps.source_integrity.outputs.source_md_sha256 }}
          CONTEXT_SHA256: ${{ steps.source_integrity.outputs.context_sha256 }}
          METADATA_SHA256: ${{ steps.source_integrity.outputs.metadata_sha256 }}
          LEAD_IMAGE_SHA256: ${{ steps.source_integrity.outputs.lead_image_sha256 }}
        run: ruby _scripts/validate_article_import.rb validate

      - name: Build production Jekyll site
        run: |
          set -o pipefail
          bundle exec jekyll build --trace --destination ./_site 2>&1 | tee "$RUNNER_TEMP/jekyll-build.log"
        env:
          JEKYLL_ENV: production
          JEKYLL_BUILD_LOG: ${{ runner.temp }}/jekyll-build.log
          BUNDLE_APP_CONFIG: ${{ runner.temp }}/article-import-bundle-config
          BUNDLE_PATH: ${{ runner.temp }}/article-import-bundle

      - name: Build Pagefind search index
        run: |
          set -o pipefail
          "$RUNNER_TEMP/pagefind/node_modules/.bin/pagefind" --site ./_site 2>&1 | tee "$RUNNER_TEMP/pagefind-build.log"

      - name: Audit generated archive and deployment assets
        run: ruby _scripts/diagnose_production_build.rb
        env:
          JEKYLL_ENV: production
          JEKYLL_BUILD_LOG: ${{ runner.temp }}/jekyll-build.log
          PAGEFIND_BUILD_LOG: ${{ runner.temp }}/pagefind-build.log

      - name: Check localized pages
        run: ruby _scripts/check_localization.rb

      - name: Push validated content and create a normal pull request
        env:
          CONTENT_PR_TOKEN: ${{ secrets.CONTENT_PR_TOKEN }}
          CONTENT_PR_REVIEWER: ${{ vars.CONTENT_PR_REVIEWER || 'Adammiszczak' }}
        run: ruby _scripts/validate_article_import.rb publish
