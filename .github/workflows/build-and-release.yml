name: Build and release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      cleanup_closed_pr:
        description: Optional closed PR number whose Cloudflare preview should be cleaned up
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_closed_pr != '' && format('cleanup-pr-{0}', inputs.cleanup_closed_pr) || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: (github.event_name != 'pull_request' || github.event.action != 'closed') && (github.event_name != 'workflow_dispatch' || inputs.cleanup_closed_pr == '')
    runs-on: ubuntu-24.04
    outputs:
      article_card_hrefs: ${{ steps.production_diagnostics.outputs.article_card_hrefs }}
      article_html_sha256: ${{ steps.production_diagnostics.outputs.article_html_sha256 }}
      pagefind_css_sha256: ${{ steps.production_diagnostics.outputs.pagefind_css_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Ruby and install dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true
      - name: Build Jekyll site
        run: |
          set -o pipefail
          bundle exec jekyll build --trace --destination ./_site 2>&1 | tee "$RUNNER_TEMP/jekyll-build.log"
        env:
          JEKYLL_ENV: production
      - name: Build Pagefind search index
        run: |
          set -o pipefail
          npx --yes pagefind@1.5.2 --site ./_site 2>&1 | tee "$RUNNER_TEMP/pagefind-build.log"
      - name: Audit generated archive and deployment assets
        id: production_diagnostics
        run: ruby _scripts/diagnose_production_build.rb
        env:
          JEKYLL_ENV: production
          JEKYLL_BUILD_LOG: ${{ runner.temp }}/jekyll-build.log
          PAGEFIND_BUILD_LOG: ${{ runner.temp }}/pagefind-build.log
      - name: Check localized pages
        run: ruby _scripts/check_localization.rb
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Save the validated site for a same-repository PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pr-preview-site
          path: ./_site
          if-no-files-found: error
          retention-days: 1

  cloudflare-pr-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download the production-equivalent build
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pr-preview-site
          path: ./_site
      - name: Validate Cloudflare Pages project name
        id: project
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [[ ! "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo "CLOUDFLARE_PAGES_PROJECT must be a lowercase Cloudflare Pages project name." >&2
            exit 1
          fi
          printf 'project_name=%s\n' "$PAGES_PROJECT" >> "$GITHUB_OUTPUT"
      - name: Deploy preview to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./_site --project-name=${{ steps.project.outputs.project_name }} --branch=pr-${{ github.event.pull_request.number }}
      - name: Resolve and validate the stable preview alias URL
        id: preview
        env:
          PREVIEW_ALIAS_URL: ${{ steps.cloudflare.outputs.pages-deployment-alias-url }}
          PAGES_PROJECT: ${{ steps.project.outputs.project_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          expected_host = f"pr-{os.environ['PR_NUMBER']}.{os.environ['PAGES_PROJECT']}.pages.dev"
          if not os.environ["PR_NUMBER"].isdigit():
              raise SystemExit("GitHub returned an invalid pull request number.")
          alias = os.environ.get("PREVIEW_ALIAS_URL", "").strip()
          if alias:
              parsed = urlsplit(alias)
              if parsed.scheme != "https" or parsed.hostname != expected_host or parsed.port not in (None, 443) or parsed.username or parsed.password or parsed.query or parsed.fragment:
                  raise SystemExit("Cloudflare returned an unexpected Pages alias URL.")
              preview_url = f"https://{expected_host}"
          else:
              preview_url = f"https://{expected_host}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"url={preview_url}\n")
          PY
      - name: Verify the preview is noindex
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          headers="$(curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 2 --dump-header - --output /dev/null "$PREVIEW_URL")"
          if ! printf '%s\n' "$headers" | awk 'BEGIN { IGNORECASE = 1 } /^x-robots-tag:/ && tolower($0) ~ /noindex/ { found = 1 } END { exit !found }'; then
            echo "Cloudflare preview did not return X-Robots-Tag: noindex." >&2
            exit 1
          fi
      - name: Add or update the PR preview comment
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- cloudflare-pr-preview -->';
            const pr = context.payload.pull_request;
            const sourceMatch = (pr.body || '').match(/^Substack reference URL:\s*(\S+)\s*$/im);
            let sourceLine = '';
            if (sourceMatch) {
              try {
                const source = new URL(sourceMatch[1]);
                const host = source.hostname.toLowerCase();
                if (source.protocol === 'https:' && !source.username && !source.password && (host === 'substack.com' || host.endsWith('.substack.com'))) {
                  sourceLine = `\n\nSource:\n${source.href}`;
                }
              } catch (_) {
                // Omit malformed source text from the generated comment.
              }
            }
            const body = `${marker}\n\n## PR preview ready\n\nPreview:\n${process.env.PREVIEW_URL}${sourceLine}\n\nThis preview was generated from the same production Jekyll build used by CI.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

  cleanup-cloudflare-pr-preview:
    if: (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.cleanup_closed_pr != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Validate Cloudflare Pages project name and PR number
        id: project
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.cleanup_closed_pr }}
        run: |
          if [[ ! "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo "CLOUDFLARE_PAGES_PROJECT must be a lowercase Cloudflare Pages project name." >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub returned an invalid pull request number." >&2
            exit 1
          fi
          printf 'project_name=%s\n' "$PAGES_PROJECT" >> "$GITHUB_OUTPUT"
          printf 'branch_name=pr-%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Verify a manually selected PR is closed
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.project.outputs.pr_number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (response.data.state !== 'closed') {
              core.setFailed(`PR #${number} is still open; refusing to clean an active preview.`);
            }
      - name: Prepare a closed-preview page
        run: |
          mkdir -p ./_closed-preview
          cat > ./_closed-preview/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex, nofollow">
            <title>Preview closed</title>
          </head>
          <body>
            <main>
              <h1>This pull request preview is closed</h1>
              <p>The preview content has been removed. Open the pull request to create a new preview.</p>
            </main>
          </body>
          </html>
          HTML
          cp ./_closed-preview/index.html ./_closed-preview/404.html
          cat > ./_closed-preview/_headers <<'HEADERS'
          /*
            X-Robots-Tag: noindex, nofollow
          HEADERS
      - name: Replace the PR preview with the closed page
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./_closed-preview --project-name=${{ steps.project.outputs.project_name }} --branch=${{ steps.project.outputs.branch_name }} --commit-message="PR #${{ steps.project.outputs.pr_number }} closed; preview content removed"
      - name: Delete superseded deployments for the PR branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.project.outputs.project_name }}
          PR_BRANCH: ${{ steps.project.outputs.branch_name }}
          PREVIEW_HOST: pr-${{ steps.project.outputs.pr_number }}.${{ steps.project.outputs.project_name }}.pages.dev
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          project = os.environ["PAGES_PROJECT"]
          branch = os.environ["PR_BRANCH"]
          preview_host = os.environ["PREVIEW_HOST"].lower()
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/{project}/deployments"

          def api(url, method="GET"):
              request = Request(url, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
              })
              try:
                  with urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except HTTPError as error:
                  try:
                      error_payload = json.loads(error.read().decode("utf-8"))
                      details = "; ".join(item.get("message", "") for item in error_payload.get("errors", []) if item.get("message"))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      details = ""
                  suffix = f": {details}" if details else ""
                  raise SystemExit(f"Cloudflare Pages API request failed (HTTP {error.code}){suffix}")
              except URLError as error:
                  raise SystemExit(f"Cloudflare Pages API request failed: {error.reason}")
              if not payload.get("success"):
                  raise SystemExit("Cloudflare Pages API returned an unsuccessful response.")
              return payload

          deployments = []
          for page in range(1, 1001):
              query = urlencode({"env": "preview", "per_page": 20, "page": page})
              batch = api(f"{base}?{query}").get("result", [])
              if not isinstance(batch, list):
                  raise SystemExit("Cloudflare returned an invalid deployment list.")
              deployments.extend(batch)
              if len(batch) < 20:
                  break
          else:
              raise SystemExit("Cloudflare deployment pagination exceeded the safety limit.")

          branch_deployments = [
              deployment for deployment in deployments
              if (deployment.get("deployment_trigger") or {}).get("metadata", {}).get("branch") == branch
          ]
          current = [
              deployment for deployment in branch_deployments
              if any(
                  (alias.removeprefix("https://").removeprefix("http://").split("/", 1)[0].lower() == preview_host)
                  for alias in (deployment.get("aliases") or [])
              )
          ]
          if len(current) != 1 or not current[0].get("id"):
              raise SystemExit("Could not identify exactly one active closed-preview deployment; no deployments were deleted.")

          keep_id = current[0]["id"]
          for deployment in branch_deployments:
              deployment_id = deployment.get("id")
              if not deployment_id or deployment_id == keep_id:
                  continue
              api(f"{base}/{deployment_id}?force=true", method="DELETE")
          print(f"Removed superseded deployments for {branch}; retained only its closed-preview deployment.")
          PY
      - name: Mark the PR preview comment as closed
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- cloudflare-pr-preview -->';
            const pr = context.payload.pull_request;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              const body = `${marker}\n\n## PR preview closed\n\nThe preview content has been removed. The preview URL now displays a closed notice.`;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }

  deploy:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.cleanup_closed_pr == '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout smoke check
        uses: actions/checkout@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed archive and Pagefind assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_ARTICLE_HREFS: ${{ needs.build.outputs.article_card_hrefs }}
          EXPECTED_ARTICLE_HTML_SHA256: ${{ needs.build.outputs.article_html_sha256 }}
          EXPECTED_PAGEFIND_CSS_SHA256: ${{ needs.build.outputs.pagefind_css_sha256 }}
        run: ruby _scripts/check_deployed_site.rb
