name: Import Substack article

on:
  workflow_dispatch:
    inputs:
      substack_url:
        description: Article URL on amiszczak.substack.com, the primary publication
        required: true
        type: string
      linkedin_url:
        description: Public LinkedIn post URL associated with this article
        required: true
        type: string
      request_id:
        description: Unique orchestration request identifier, normally generated by n8n
        required: true
        type: string

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the master base branch without persisted credentials
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false

      - name: Validate inputs
        env:
          SUBSTACK_URL: ${{ inputs.substack_url }}
          LINKEDIN_URL: ${{ inputs.linkedin_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 _scripts/fetch_substack_source.py validate-inputs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Ruby and install locked dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true

      - name: Install the pinned Pagefind dependency before Codex
        run: npm install --prefix "$RUNNER_TEMP/pagefind" pagefind@1.5.2

      - name: Fetch publication RSS, resolve article, and use HTML fallback when needed
        env:
          SUBSTACK_URL: ${{ inputs.substack_url }}
          LINKEDIN_URL: ${{ inputs.linkedin_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 _scripts/fetch_substack_source.py fetch

      - name: Reject an already imported Substack article
        env:
          SUBSTACK_URL: ${{ inputs.substack_url }}
          LINKEDIN_URL: ${{ inputs.linkedin_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 _scripts/fetch_substack_source.py check-duplicate

      - name: Verify deterministic source body, publication date, and lead image
        env:
          SUBSTACK_URL: ${{ inputs.substack_url }}
          LINKEDIN_URL: ${{ inputs.linkedin_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 _scripts/fetch_substack_source.py verify-source

      - name: Record source integrity before Codex
        id: source_integrity
        env:
          SUBSTACK_URL: ${{ inputs.substack_url }}
          LINKEDIN_URL: ${{ inputs.linkedin_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 _scripts/fetch_substack_source.py record-integrity

      - name: Run Codex with repository instructions
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .github/prompts/import-substack-article.md

      - name: Validate generated articles and stage the PR manifest
        env:
          SUBSTACK_URL: ${{ inputs.substack_url }}
          LINKEDIN_URL: ${{ inputs.linkedin_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_HTML_SHA256: ${{ steps.source_integrity.outputs.source_html_sha256 }}
          SOURCE_RSS_SHA256: ${{ steps.source_integrity.outputs.source_rss_sha256 }}
          METADATA_SHA256: ${{ steps.source_integrity.outputs.metadata_sha256 }}
          CONTEXT_SHA256: ${{ steps.source_integrity.outputs.context_sha256 }}
          LEAD_IMAGE_SHA256: ${{ steps.source_integrity.outputs.lead_image_sha256 }}
        run: ruby _scripts/validate_substack_import.rb validate

      - name: Build production Jekyll site
        run: |
          set -o pipefail
          bundle exec jekyll build --trace --destination ./_site 2>&1 | tee "$RUNNER_TEMP/jekyll-build.log"
        env:
          JEKYLL_ENV: production
          JEKYLL_BUILD_LOG: ${{ runner.temp }}/jekyll-build.log

      - name: Build Pagefind search index
        run: |
          set -o pipefail
          "$RUNNER_TEMP/pagefind/node_modules/.bin/pagefind" --site ./_site 2>&1 | tee "$RUNNER_TEMP/pagefind-build.log"

      - name: Audit generated archive and deployment assets
        run: ruby _scripts/diagnose_production_build.rb
        env:
          JEKYLL_ENV: production
          JEKYLL_BUILD_LOG: ${{ runner.temp }}/jekyll-build.log
          PAGEFIND_BUILD_LOG: ${{ runner.temp }}/pagefind-build.log

      - name: Check localized pages
        run: ruby _scripts/check_localization.rb

      - name: Push validated content and create a normal pull request
        env:
          CONTENT_PR_TOKEN: ${{ secrets.CONTENT_PR_TOKEN }}
        run: ruby _scripts/validate_substack_import.rb publish
