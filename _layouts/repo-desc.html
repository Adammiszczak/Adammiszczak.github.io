---
layout: default
---
<article class="post-page">
  <header class="page-heading">
    <p class="eyebrow">History archive</p>
    <h1>{{ page.title | escape }}</h1>
    <p class="post-meta">Published {{ page.date | date: "%B %-d, %Y" }} · Adam Miszczak</p>
    {% if page.technologies %}<p class="tag-list">{% for technology in page.technologies %}<span>{{ technology | escape }}</span>{% endfor %}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
