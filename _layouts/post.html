---
layout: default
---
<article class="post-page">
  <header class="page-heading">
    <h1>{{ page.title | escape }}</h1>
    {% if page.date %}<p class="post-meta">Published {{ page.date | date: "%B %-d, %Y" }} · Adam Miszczak</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
