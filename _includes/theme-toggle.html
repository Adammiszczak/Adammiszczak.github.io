{% assign locale_key = page.lang | default: 'en' %}
{% assign copy = site.data.site_copy[locale_key] %}
<button class="theme-toggle" type="button" data-theme-toggle data-label-dark="{{ copy.switch_to_dark }}" data-label-light="{{ copy.switch_to_light }}" aria-label="{{ copy.switch_to_dark }}" title="{{ copy.switch_to_dark }}" aria-pressed="false">
  <svg class="theme-toggle-icon theme-toggle-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
  <svg class="theme-toggle-icon theme-toggle-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"></path></svg>
</button>
